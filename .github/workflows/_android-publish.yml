name: Android · Reusable publish (single flavor)

# Reusable workflow: builds & signs ONE flavor's release AAB and uploads it to its
# Play Console app. Called by release.yml once per selected merchant (matrix).
# Generalises the proven android-play-internal.yml; do not trigger directly.

on:
  workflow_call:
    inputs:
      flavor:
        description: "Android product flavor (default | merchantA | merchantB | merchantC)"
        required: true
        type: string
      entrypoint:
        description: "Dart entrypoint, e.g. lib/main_merchant_a.dart"
        required: true
        type: string
      package_name:
        description: "Play Console applicationId for this flavor"
        required: true
        type: string
      mapping_dir:
        description: "Gradle mapping output dir, e.g. merchantARelease"
        required: true
        type: string
      track:
        description: "Play track"
        required: true
        type: string
      status:
        description: "Play release status"
        required: true
        type: string
      release_notes:
        description: "Release notes (zh-TW & en-US)"
        required: false
        type: string
        default: "CI build"
    secrets:
      # Passed explicitly by the caller (least-privilege; no `secrets: inherit`).
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.4"
  JAVA_VERSION: "17"
  # CI owns the version code. pubspec '+11' is ignored at build time; each store
  # upload gets a unique, monotonically increasing code = BASE_BUILD_OFFSET + run number.
  BASE_BUILD_OFFSET: "1000"

jobs:
  build-and-distribute:
    name: ${{ inputs.flavor }} → Play (${{ inputs.track }}/${{ inputs.status }})
    runs-on: ubuntu-latest
    concurrency:
      # One in-flight publish per flavor+track; never cancel a job that holds signing keys mid-upload.
      group: android-publish-${{ inputs.flavor }}-${{ inputs.track }}
      cancel-in-progress: false
    steps:
      - name: Guard — default flavor is UAT (internal track only)
        if: ${{ inputs.flavor == 'default' && inputs.track != 'internal' }}
        run: |
          echo "::error::flavor 'default' points at the UAT API; only the 'internal' track is allowed (got '${{ inputs.track }}')."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Verify committed keystore present
        run: |
          if [[ ! -f "android/xsmartlive-plus-one" ]]; then
            echo "::error::Committed keystore android/xsmartlive-plus-one not found"
            exit 1
          fi
          echo "Keystore: $(wc -c < android/xsmartlive-plus-one) bytes"

      - name: flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Compute build number
        id: ver
        run: |
          # Monotonic & unique per Play app. *100 leaves headroom for re-run attempts
          # (GITHUB_RUN_ATTEMPT) so a "Re-run jobs" doesn't reuse a versionCode Play already has.
          bn=$(( BASE_BUILD_OFFSET + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          echo "build_number=$bn" >> "$GITHUB_OUTPUT"
          echo "versionCode for this run: $bn (run $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT)"

      - name: Build release AAB
        env:
          # B3: point at the real committed keystore (no .jks extension).
          ANDROID_KEYSTORE_PATH: ../xsmartlive-plus-one
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --release \
            --flavor ${{ inputs.flavor }} \
            -t ${{ inputs.entrypoint }} \
            --build-number=${{ steps.ver.outputs.build_number }}

      - name: Locate AAB
        id: aab
        shell: bash
        run: |
          aab_path=$(find build/app/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [[ -z "$aab_path" ]]; then
            echo "::error::No AAB produced"
            find build/app/outputs -type f -name "*.aab" || true
            exit 1
          fi
          echo "path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "Found AAB: $aab_path ($(du -h "$aab_path" | cut -f1))"

      - name: Verify versionCode in AAB filename
        shell: bash
        env:
          AAB_PATH: ${{ steps.aab.outputs.path }}
          EXPECTED: ${{ steps.ver.outputs.build_number }}
        run: |
          # B4 sanity check. NOTE: `aapt2 dump badging` only supports APKs, not AABs.
          # The gradle rename stamps the versionCode into the filename
          # (app-<flavor>-release-v<name>-<code>.aab), so we assert against that. Non-fatal.
          base=$(basename "$AAB_PATH")
          if [[ "$base" == *"-${EXPECTED}.aab" ]]; then
            echo "versionCode ${EXPECTED} confirmed in AAB filename: $base"
          else
            echo "::warning::AAB filename '$base' does not end with -${EXPECTED}.aab; continuing anyway."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.flavor }}
          path: ${{ steps.aab.outputs.path }}
          retention-days: 14

      - name: Write release notes file
        id: notes
        shell: bash
        env:
          # Pass via env (not inline ${{ }}) to avoid shell injection from release_notes.
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p distribution/whatsnew
          printf '%s\n' "$RELEASE_NOTES" > distribution/whatsnew/whatsnew-zh-TW
          printf '%s\n' "$RELEASE_NOTES" > distribution/whatsnew/whatsnew-en-US
          echo "dir=distribution/whatsnew" >> "$GITHUB_OUTPUT"

      - name: Locate mapping (optional — R8 may be off)
        id: map
        shell: bash
        run: |
          m="build/app/outputs/mapping/${{ inputs.mapping_dir }}/mapping.txt"
          if [[ -f "$m" ]]; then
            echo "file=$m" >> "$GITHUB_OUTPUT"
            echo "mapping: $m"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "No mapping.txt at $m (minify likely disabled) — skipping deobfuscation upload."
          fi

      # All flavors currently share PLAY_SERVICE_ACCOUNT_JSON (passed explicitly above).
      # Per-merchant SAs (Phase 2): add each to the secrets: block + caller, and select per matrix
      # entry — dynamic secrets[...] indexing is deliberately avoided.
      # Two steps because r0adkll/upload-google-play throws on an empty/missing mappingFile,
      # and R8 is currently off (no mapping.txt).
      - name: Upload to Play Console (with mapping)
        if: ${{ steps.map.outputs.file != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
          mappingFile: ${{ steps.map.outputs.file }}

      - name: Upload to Play Console (no mapping)
        if: ${{ steps.map.outputs.file == '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
