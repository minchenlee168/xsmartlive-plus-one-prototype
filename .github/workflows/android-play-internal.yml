name: Android · Play Console Internal Testing (legacy, default only)

# SUPERSEDED by release.yml + _android-publish.yml (multi-merchant).
# Kept as a manual-only fallback for the default flavor. Its v* tag trigger was
# removed so tag pushes don't double-publish default (release.yml owns tags now).

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for testers (zh-TW)"
        type: string
        required: false
        default: "CI build"
      track:
        description: "Play track"
        type: choice
        required: true
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (use draft while app itself is draft in Play Console)"
        type: choice
        required: true
        default: draft
        options:
          - draft
          - completed
          - inProgress
          - halted

env:
  FLUTTER_VERSION: "3.41.4"
  JAVA_VERSION: "17"
  PACKAGE_NAME: "com.xsmartlive.plus.one"
  FLAVOR: "default"
  ENTRYPOINT: "lib/main.dart"

jobs:
  build-and-distribute:
    name: Build AAB & upload to Play (${{ github.event.inputs.track || 'internal' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Verify committed keystore present
        run: |
          if [[ ! -f "android/xsmartlive-plus-one" ]]; then
            echo "::error::Committed keystore android/xsmartlive-plus-one not found"
            exit 1
          fi
          echo "Keystore: $(wc -c < android/xsmartlive-plus-one) bytes"

      - name: flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ../xsmartlive-plus-one
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --release \
            --flavor ${{ env.FLAVOR }} \
            -t ${{ env.ENTRYPOINT }}

      - name: Locate AAB
        id: aab
        shell: bash
        run: |
          aab_path=$(find build/app/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [[ -z "$aab_path" ]]; then
            echo "::error::No AAB produced"
            find build/app/outputs -type f -name "*.aab" || true
            exit 1
          fi
          echo "path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "Found AAB: $aab_path ($(du -h "$aab_path" | cut -f1))"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ env.FLAVOR }}
          path: ${{ steps.aab.outputs.path }}
          retention-days: 14

      - name: Write release notes file
        id: notes
        shell: bash
        run: |
          mkdir -p distribution/whatsnew
          notes="${{ github.event.inputs.release_notes || format('Tag build {0}', github.ref_name) }}"
          printf '%s\n' "$notes" > distribution/whatsnew/whatsnew-zh-TW
          printf '%s\n' "$notes" > distribution/whatsnew/whatsnew-en-US
          echo "dir=distribution/whatsnew" >> "$GITHUB_OUTPUT"

      - name: Upload to Play Console (${{ github.event.inputs.track || 'internal' }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
          mappingFile: build/app/outputs/mapping/${{ env.FLAVOR }}Release/mapping.txt

