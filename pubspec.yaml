name: xsmartlive_plus_one
description: "直播購物 White-Label Multi-Merchant App"
publish_to: 'none'
version: 1.1.3+11

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Social Auth
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.6
  webview_flutter: ^4.10.0

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Fonts (dynamic from remote theme)
  google_fonts: ^6.2.1

  # Video player
  video_player: ^2.9.5
  chewie: ^1.8.5

  # Models (code generation)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Localisation
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  facebook_app_events: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/flavors/merchant_a/
    - assets/flavors/merchant_b/
    - assets/flavors/merchant_c/
    - assets/
    - assets/icons/
    - assets/icons/orders/
    - assets/icons/stores/
    - assets/prototype/
    - assets/prototype/categories/
    - assets/prototype/products/